name: Deploy Frontend (Next.js + Docker)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      REMOTE_DIR: /opt/dinovatio-frontend
      EXTERNAL_PORT: 5006

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose config

      # SUBIR TODO EL REPO (sin exclusiones) para evitar "tar: empty archive"
      - name: Upload project to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: "."                 # <- importante: sin exclusiones aquí
          target: ${{ env.REMOTE_DIR }}

      # Pasamos REMOTE_DIR y EXTERNAL_PORT al entorno remoto con 'envs'
      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: REMOTE_DIR,EXTERNAL_PORT
          script_stop: true
          script: |
            set -euo pipefail

            echo "==> Preparando directorio y permisos"
            sudo mkdir -p "${REMOTE_DIR}"
            sudo chown -R "${USER}:${USER}" "${REMOTE_DIR}"
            cd "${REMOTE_DIR}"

            echo "==> Instalando Docker si falta"
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
            fi

            echo "==> Iniciando y habilitando Docker"
            if command -v systemctl >/dev/null 2>&1; then
              sudo systemctl enable --now docker || true
              sudo systemctl start docker || true
            else
              # sistemas sin systemd (init/sysv/openrc)
              sudo service docker start || true
              # fallback extremo: lanzar dockerd en background si nada anterior funciona
              pgrep dockerd >/dev/null 2>&1 || (sudo nohup dockerd >/tmp/dockerd.log 2>&1 &)
            fi

            echo "==> Esperando a que el daemon responda"
            for i in $(seq 1 30); do
              if sudo docker info >/dev/null 2>&1; then
                echo "Docker OK"
                break
              fi
              sleep 2
              if [ "$i" -eq 30 ]; then
                echo "ERROR: Docker no levantó a tiempo"
                exit 1
              fi
            done

            echo "==> Instalando Docker Compose plugin si falta"
            if ! sudo docker compose version >/dev/null 2>&1; then
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -SL \
                https://github.com/docker/compose/releases/download/v2.29.2/docker-compose-linux-x86_64 \
                -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            fi

            echo "==> Creando/actualizando archivo .env de producción"
            SITE_URL="http://${{ secrets.SSH_HOST }}:${EXTERNAL_PORT}"
            cat > .env <<EOF
            NEXT_PUBLIC_SITE_URL=${SITE_URL}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            EOF

            echo "==> Bajando contenedores antiguos (si existen)"
            sudo docker compose down --remove-orphans || true

            echo "==> Construyendo e iniciando en segundo plano"
            sudo docker compose up -d --build --remove-orphans

            echo "==> Estado de los contenedores"
            sudo docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

            echo "==> Logs iniciales (10s)"
            sudo timeout 10s docker logs -f dinovatio-frontend || true
